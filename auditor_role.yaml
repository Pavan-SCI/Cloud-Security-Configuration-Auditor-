AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploys a secure, read-only IAM Role allowing the AWS Cloud Security Configuration Auditor SaaS to audit account settings.'

Parameters:
  SaaSAccountId:
    Type: String
    Description: 'The AWS Account ID of the SaaS platform backend allowed to assume this role.'
    Default: '123456789012' # Placeholder for SaaS platform AWS account ID
  ExternalId:
    Type: String
    Description: 'A unique token generated by the SaaS platform for your connection to prevent the Confused Deputy problem.'
    Default: 'auditor-secure-token-xyz'

Resources:
  SecurityAuditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AWS-Security-Auditor-Role-${AWS::Region}'
      Description: 'Cross-account read-only security auditing role for AWS Cloud Security Auditor SaaS.'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${SaaSAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Policies:
        - PolicyName: 'SaaSAuditReadOnlyPolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'iam:ListUsers'
                  - 'iam:ListMFADevices'
                  - 'iam:ListAccessKeys'
                  - 's3:ListAllMyBuckets'
                  - 's3:GetBucketLocation'
                  - 's3:GetPublicAccessBlock'
                Resource: '*'

Outputs:
  RoleARN:
    Description: 'The ARN of the newly created auditing IAM Role. Copy and paste this into the SaaS dashboard.'
    Value: !GetAtt SecurityAuditorRole.Arn
